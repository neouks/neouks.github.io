<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECU Log Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <main class="main-layout">
      <section class="chart-card sh-card">
        <header class="chart-header">
          <div id="appLogo" class="app-logo" hidden>
            <img id="appLogoImage" alt="应用 LOGO" />
          </div>
          <div class="chart-heading">
            <p class="eyebrow">ECU Log Viewer</p>
            <h1 id="chartTitle">LOG 对比</h1>
          </div>
        </header>

        <div id="canvasWrap" class="canvas-wrap">
          <div id="logGrid" class="log-grid" aria-live="polite">
            <article class="log-window" data-log-id="primary">
              <header class="log-window-header">
                <div>
                  <p class="eyebrow">LOG A</p>
                  <h2 data-role="slotTitle">等待加载</h2>
                </div>
                <button class="sh-button sh-button-secondary slot-load-btn" type="button" data-load-slot="primary">重新加载</button>
              </header>
              <div class="chart-area">
                <canvas data-role="chart"></canvas>
                <div class="coordinate-tooltip" data-role="tooltip" aria-hidden="true"></div>
              </div>
              <div class="chart-navigator" data-role="navigator" aria-hidden="true">
                <div class="navigator-actions">
                  <button class="navigator-button" type="button" data-action="zoom-out" aria-label="缩小 X 轴">−</button>
                  <span data-role="rangeMeta">区间 --</span>
                  <button class="navigator-button" type="button" data-action="zoom-in" aria-label="放大 X 轴">+</button>
                </div>
                <div class="navigator-track" data-role="navigatorTrack">
                  <canvas data-role="navigatorCanvas"></canvas>
                  <div class="navigator-selection" data-role="navigatorSelection">
                    <button class="navigator-handle left" type="button" data-role="leftHandle" aria-label="调整左边界"><span></span></button>
                    <button class="navigator-handle right" type="button" data-role="rightHandle" aria-label="调整右边界"><span></span></button>
                  </div>
                </div>
              </div>
            </article>

            <article class="log-window" data-log-id="compare">
              <header class="log-window-header">
                <div>
                  <p class="eyebrow">LOG B</p>
                  <h2 data-role="slotTitle">等待加载</h2>
                </div>
                <button class="sh-button sh-button-secondary slot-load-btn" type="button" data-load-slot="compare">加载对比</button>
              </header>
              <div class="chart-area">
                <canvas data-role="chart"></canvas>
                <div class="coordinate-tooltip" data-role="tooltip" aria-hidden="true"></div>
              </div>
              <div class="chart-navigator" data-role="navigator" aria-hidden="true">
                <div class="navigator-actions">
                  <button class="navigator-button" type="button" data-action="zoom-out" aria-label="缩小 X 轴">−</button>
                  <span data-role="rangeMeta">区间 --</span>
                  <button class="navigator-button" type="button" data-action="zoom-in" aria-label="放大 X 轴">+</button>
                </div>
                <div class="navigator-track" data-role="navigatorTrack">
                  <canvas data-role="navigatorCanvas"></canvas>
                  <div class="navigator-selection" data-role="navigatorSelection">
                    <button class="navigator-handle left" type="button" data-role="leftHandle" aria-label="调整左边界"><span></span></button>
                    <button class="navigator-handle right" type="button" data-role="rightHandle" aria-label="调整右边界"><span></span></button>
                  </div>
                </div>
              </div>
            </article>
          </div>
          <label id="emptyState" class="empty-state upload-empty sh-card">
            <input id="fileInput" type="file" accept=".csv,.xlsx,.xls" multiple />
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <path d="M17 8l-5-5-5 5" />
                <path d="M12 3v12" />
              </svg>
            </span>
            <strong>上传 LOG 数据</strong>
            <span id="fileMeta" class="file-meta">拖入或点击上传LOG文件（支持2份LOG对比）</span>
          </label>
          <input id="slotFileInput" class="visually-hidden-file" type="file" accept=".csv,.xlsx,.xls" />
        </div>
      </section>

      <section class="datalog-section sh-card">
        <div class="section-title-row">
          <div>
            <p class="eyebrow">Raw Data</p>
            <h2>数据流表格</h2>
          </div>
          <button id="dataTableToggle" class="sh-button sh-button-secondary datalog-toggle" type="button">
            <span>展开表格</span>
            <i aria-hidden="true"></i>
          </button>
        </div>
        <div id="dataTablePanel" class="datalog-panel" aria-hidden="true">
          <div id="dataTableWrap" class="data-table-wrap empty">请先上传日志文件</div>
          <div class="datalog-actions">
            <button id="exportCsvBtn" class="sh-button" type="button">导出 CSV</button>
          </div>
        </div>
      </section>
    </main>
  </div>

  <button id="drawerToggle" class="drawer-toggle sh-button" type="button" aria-label="打开或关闭 Measures 面板">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 6h16" />
      <path d="M4 12h16" />
      <path d="M4 18h16" />
    </svg>
    <span>Measures</span>
  </button>

  <aside id="controlDrawer" class="control-drawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="eyebrow">Controls</p>
        <h2>Measures</h2>
      </div>
      <div class="drawer-actions">
        <button id="themeToggle" class="sh-button sh-button-secondary theme-toggle" type="button" aria-label="切换深浅色主题">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 7.5A9 9 0 1 1 12 3Z"/></svg>
          <span>主题</span>
        </button>
        <button id="loadCompareBtn" class="sh-button sh-button-secondary" type="button">加载对比</button>
        <button id="reloadAllBtn" class="sh-button sh-button-secondary" type="button">重新加载</button>
        <button id="toggleAllBtn" class="sh-button sh-button-secondary" type="button">隐藏全部</button>
      </div>
    </div>

    <section class="drawer-options sh-card">
      <label class="switch-row">
        <input id="showExtrema" type="checkbox" checked />
        <span class="switch-ui" aria-hidden="true"></span>
        <span>Min / Max points</span>
      </label>
      <label class="switch-row">
        <input id="showPoints" type="checkbox" />
        <span class="switch-ui" aria-hidden="true"></span>
        <span>Sample points</span>
      </label>
    </section>

    <section class="measures-panel sh-card">
      <div class="panel-title-row">
        <h2>数据流</h2>
        <span><span id="measureCount">0</span> measures</span>
      </div>
      <div id="measureGroups" class="measure-groups empty">请先上传日志文件</div>
    </section>

    <section class="stats-card sh-card">
      <div class="panel-title-row">
        <h2>Min / Max</h2>
        <span id="visibleCount">0 visible</span>
      </div>
      <div id="statsTable" class="stats-table empty">暂无数据</div>
    </section>
    
    <section class="appearance-panel sh-card">
      <div class="panel-title-row">
        <h2>外观</h2>
        <span>图片</span>
      </div>
      <div class="asset-control">
        <div>
          <strong>数据流背景</strong>
          <span id="backgroundStatus">使用默认网格背景</span>
        </div>
        <div class="asset-actions">
          <label class="sh-button sh-button-secondary asset-upload-btn">
            <input id="backgroundImageInput" type="file" accept="image/*" />
            <span>上传图片</span>
          </label>
          <button id="clearBackgroundBtn" class="sh-button sh-button-secondary" type="button">清除</button>
        </div>
      </div>
      <div class="asset-control">
        <div>
          <strong>左上角 LOGO</strong>
          <span id="logoStatus">未设置 LOGO</span>
        </div>
        <div class="asset-actions">
          <label class="sh-button sh-button-secondary asset-upload-btn">
            <input id="logoImageInput" type="file" accept="image/*" />
            <span>上传 LOGO</span>
          </label>
          <button id="clearLogoBtn" class="sh-button sh-button-secondary" type="button">清除</button>
        </div>
      </div>
    </section>
    <p class="drawer-author">开发作者：NEO</p>
  </aside>

  <section id="aiTranslateCard" class="ai-translate-card ai-floating-panel sh-card collapsed" aria-hidden="true">
    <div class="panel-title-row ai-title-row ai-floating-title">
      <div>
        <h2>AI 翻译</h2>
        <span class="panel-subtitle">数据流翻译</span>
      </div>
      <div class="ai-panel-toolbar">
        <button id="aiConfigToggle" class="sh-button sh-button-secondary ai-config-toggle" type="button" aria-controls="aiConfigPanel" aria-expanded="false">
          <span>模型配置</span>
          <i aria-hidden="true"></i>
        </button>
        <button id="aiPanelClose" class="sh-button sh-button-secondary ai-panel-close" type="button" aria-label="收起AI翻译">收起</button>
      </div>
    </div>
    <div class="ai-collapsible">
      <div id="aiConfigPanel" class="ai-config-panel" hidden>
        <div class="ai-field-grid">
          <label>
            <span>模型服务</span>
            <select id="aiProvider" class="sh-input sh-select">
              <option value="deepseek">DeepSeek</option>
              <option value="glm">GLM / 智谱</option>
              <option value="deepl">DeepL</option>
              <option value="openai">OpenAI</option>
              <option value="gemini">Gemini</option>
              <option value="grok">Grok / xAI</option>
              <option value="custom">OpenAI兼容</option>
            </select>
          </label>
          <label>
            <span>API 地址</span>
            <input id="aiEndpoint" class="sh-input" type="url" placeholder="https://api.deepseek.com" autocomplete="off" />
          </label>
          <label>
            <span>API Key</span>
            <input id="aiApiKey" class="sh-input" type="password" placeholder="sk-..." autocomplete="off" />
          </label>
          <label>
            <span>模型</span>
            <select id="aiModel" class="sh-input sh-select"></select>
          </label>
          <label id="aiCustomModelRow" hidden>
            <span>自定义模型</span>
            <input id="aiCustomModel" class="sh-input" type="text" placeholder="输入模型名称" autocomplete="off" />
          </label>
          <label>
            <span>源语言</span>
            <select id="aiSourceLang" class="sh-input sh-select">
              <option value="auto">自动识别</option>
              <option value="en">英语</option>
              <option value="zh">中文</option>
              <option value="ja">日语</option>
              <option value="de">德语</option>
              <option value="fr">法语</option>
              <option value="es">西班牙语</option>
              <option value="ko">韩语</option>
              <option value="ru">俄语</option>
            </select>
          </label>
          <label>
            <span>目标语言</span>
            <select id="aiTargetLang" class="sh-input sh-select">
              <option value="zh">中文</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
              <option value="de">德语</option>
              <option value="fr">法语</option>
              <option value="es">西班牙语</option>
              <option value="ko">韩语</option>
              <option value="ru">俄语</option>
            </select>
          </label>
        </div>
        <div class="ai-actions ai-config-actions">
          <button id="testApiBtn" class="sh-button sh-button-secondary" type="button">测试API</button>
          <button id="listModelsBtn" class="sh-button sh-button-secondary" type="button">查看模型</button>
        </div>
      </div>
      <div class="ai-actions ai-actions-primary">
        <button id="translateMeasuresBtn" class="sh-button sh-button-secondary" type="button">AI翻译</button>
        <button id="clearTranslationsBtn" class="sh-button sh-button-secondary" type="button">清除翻译</button>
      </div>
      <p id="translationStatus" class="translation-status">模型配置已折叠，可展开设置 API / 模型 后进行 AI 翻译。</p>
    </div>
  </section>

  <button id="aiTranslateToggle" class="ai-fab" type="button" aria-controls="aiTranslateCard" aria-expanded="false" aria-label="打开AI翻译">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="aiGeminiMain" x1="4" y1="4" x2="20" y2="20" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#1D4ED8"></stop>
          <stop offset="1" stop-color="#0F766E"></stop>
        </linearGradient>
        <linearGradient id="aiGeminiSpark" x1="16.2" y1="3.6" x2="20.4" y2="8" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#2563EB"></stop>
          <stop offset="1" stop-color="#7C3AED"></stop>
        </linearGradient>
      </defs>
      <path d="M12 2.6C13.12 7.68 15.32 9.88 20.4 11C15.32 12.12 13.12 14.32 12 19.4C10.88 14.32 8.68 12.12 3.6 11C8.68 9.88 10.88 7.68 12 2.6Z" fill="url(#aiGeminiMain)"></path>
      <path d="M18.45 4.1C18.74 5.43 19.31 6 20.65 6.29C19.31 6.58 18.74 7.15 18.45 8.49C18.16 7.15 17.59 6.58 16.25 6.29C17.59 6 18.16 5.43 18.45 4.1Z" fill="url(#aiGeminiSpark)"></path>
    </svg>
  </button>

  <script type="module" src="./app.js"></script>
</body>
</html>
